<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Vaibhav Asare — Applied Intelligence Dashboard</title>
  <desc id="description">A custom animated AI radar dashboard with panels for Vaibhav's profile, machine learning and vision interests, projects, and data engineering and cloud learning goals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090e"/>
      <stop offset=".55" stop-color="#02070d"/>
      <stop offset="1" stop-color="#09111a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171c25" stop-opacity=".98"/>
      <stop offset="1" stop-color="#0b1018" stop-opacity=".98"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#064968" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#06172a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#03101c" stop-opacity=".15"/>
    </radialGradient>
    <filter id="cyan-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0a90ad" stroke-opacity=".13" stroke-width=".7"/>
    </pattern>
    <clipPath id="radar-clip">
      <circle cx="600" cy="300" r="180"/>
    </clipPath>
  </defs>

  <rect width="1200" height="600" rx="14" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="598" rx="13" fill="url(#grid)" stroke="#253442"/>

  <g fill="#c6f7ff">
    <circle cx="383" cy="66" r="1.4" opacity=".8"/>
    <circle cx="806" cy="79" r="1" opacity=".75"/>
    <circle cx="369" cy="291" r="1.2" opacity=".6"/>
    <circle cx="832" cy="334" r="1.2" opacity=".75"/>
    <circle cx="480" cy="500" r="1" opacity=".7"/>
    <circle cx="747" cy="518" r="1.4" opacity=".65"/>
    <circle cx="594" cy="64" r="1.1" opacity=".65"/>
    <circle cx="1115" cy="348" r="1.2" opacity=".7"/>
    <circle cx="83" cy="322" r="1" opacity=".6"/>
  </g>

  <g fill="url(#card)" stroke="#183444" stroke-width="1">
    <rect x="44" y="42" width="300" height="166" rx="9"/>
    <rect x="856" y="42" width="300" height="166" rx="9"/>
    <rect x="44" y="392" width="300" height="166" rx="9"/>
    <rect x="856" y="392" width="300" height="166" rx="9"/>
  </g>
  <g fill="none" stroke="#00d9ff" stroke-width="2">
    <path d="M38 66V36h30M320 36h30v30M38 184v30h30M320 214h30v-30"/>
    <path d="M850 66V36h30M1132 36h30v30M850 184v30h30M1132 214h30v-30"/>
    <path d="M38 416v-30h30M320 386h30v30M38 534v30h30M320 564h30v-30"/>
    <path d="M850 416v-30h30M1132 386h30v30M850 534v30h30M1132 564h30v-30"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <text x="62" y="72" fill="#00d9ff" font-size="15" font-weight="700" letter-spacing="1.5">PROFILE SIGNAL</text>
      <path d="M62 88H326" stroke="#1b7183" stroke-opacity=".7"/>
      <text x="62" y="119" fill="#f0f7ff" font-size="23" font-weight="700">Vaibhav Asare</text>
      <text x="62" y="145" fill="#bed0df" font-size="14">AI enthusiast · Nagpur, India</text>
      <text x="62" y="178" fill="#7fa3b6" font-size="12" letter-spacing=".8">MACHINE LEARNING / APPLIED AI</text>
    </g>
    <g>
      <text x="874" y="72" fill="#00d9ff" font-size="15" font-weight="700" letter-spacing="1.5">FOCUS AREAS</text>
      <path d="M874 88H1138" stroke="#1b7183" stroke-opacity=".7"/>
      <circle cx="882" cy="112" r="3" fill="#00d9ff"/>
      <text x="895" y="117" fill="#d6e5f1" font-size="14">Machine learning</text>
      <circle cx="882" cy="137" r="3" fill="#00d9ff"/>
      <text x="895" y="142" fill="#d6e5f1" font-size="14">Computer vision</text>
      <circle cx="882" cy="162" r="3" fill="#00d9ff"/>
      <text x="895" y="167" fill="#d6e5f1" font-size="14">Natural language processing</text>
      <text x="874" y="191" fill="#7897a9" font-size="11" letter-spacing=".8">CURRENTLY EXPLORING LOCAL AI</text>
    </g>
    <g>
      <text x="62" y="422" fill="#00d9ff" font-size="15" font-weight="700" letter-spacing="1.5">PROJECT ARCHIVE</text>
      <path d="M62 438H326" stroke="#1b7183" stroke-opacity=".7"/>
      <text x="62" y="466" fill="#d6e5f1" font-size="13">AI YouTube Shorts Generator</text>
      <text x="62" y="491" fill="#d6e5f1" font-size="13">Local AI laptop guide</text>
      <text x="62" y="516" fill="#d6e5f1" font-size="13">Real-time sign-language vision</text>
      <text x="62" y="543" fill="#7897a9" font-size="11" letter-spacing=".8">IDEAS TURNED INTO PRACTICAL BUILDS</text>
    </g>
    <g>
      <text x="874" y="422" fill="#00d9ff" font-size="15" font-weight="700" letter-spacing="1.5">NEXT FRONTIER</text>
      <path d="M874 438H1138" stroke="#1b7183" stroke-opacity=".7"/>
      <text x="874" y="470" fill="#00d9ff" font-family="Consolas, monospace" font-size="12">&gt; Growing data engineering skills</text>
      <text x="874" y="495" fill="#00d9ff" font-family="Consolas, monospace" font-size="12">&gt; Exploring cloud foundations</text>
      <text x="874" y="520" fill="#00d9ff" font-family="Consolas, monospace" font-size="12">&gt; Building at the AI + data edge</text>
      <text x="874" y="543" fill="#7897a9" font-size="11" letter-spacing=".8">STATUS: ALWAYS LEARNING</text>
    </g>
  </g>

  <circle cx="600" cy="300" r="202" fill="#00bde8" opacity=".045"/>
  <g fill="none" stroke="#00c8f5">
    <circle cx="600" cy="300" r="189" stroke-opacity=".13" stroke-dasharray="3 9"/>
    <circle cx="600" cy="300" r="157" stroke-opacity=".36" stroke-width="1.2"/>
    <circle cx="600" cy="300" r="128" stroke-opacity=".26" stroke-width="1"/>
    <circle cx="600" cy="300" r="94" stroke-opacity=".48" stroke-width="1.3"/>
    <circle cx="600" cy="300" r="76" stroke-opacity=".9" stroke-width="2"/>
    <circle cx="600" cy="300" r="66" stroke-opacity=".42" stroke-width=".8"/>
  </g>
  <circle cx="600" cy="300" r="58" fill="url(#core)" stroke="#02d9ff" stroke-opacity=".7"/>
  <g clip-path="url(#radar-clip)" stroke="#00c8f5" stroke-opacity=".18">
    <path d="M600 101V499M401 300H799M459 159 741 441M741 159 459 441"/>
  </g>
  <g fill="none" stroke="#00d9ff" stroke-opacity=".34">
    <path d="M600 300 687 167"/>
    <path d="M600 300 756 283"/>
    <path d="M600 300 508 426"/>
    <path d="M600 300 483 231"/>
  </g>
  <g fill="#00d9ff" filter="url(#cyan-glow)">
    <circle cx="687" cy="167" r="5"/>
    <circle cx="756" cy="283" r="5"/>
    <circle cx="508" cy="426" r="5"/>
    <circle cx="483" cy="231" r="5"/>
    <circle cx="600" cy="300" r="4"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#00d9ff" font-size="12" font-weight="700">
    <text x="669" y="151">ML</text>
    <text x="766" y="286">CV</text>
    <text x="484" y="448">NLP</text>
    <text x="457" y="219">AI</text>
  </g>
  <g fill="#b5f7ff" opacity=".78">
    <circle cx="575" cy="271" r="1.7"/>
    <circle cx="628" cy="276" r="1.7"/>
    <circle cx="624" cy="323" r="1.7"/>
    <circle cx="570" cy="329" r="1.7"/>
  </g>
  <circle cx="600" cy="300" r="20" fill="#062333" stroke="#00d9ff" stroke-opacity=".85"/>
  <text x="600" y="305" text-anchor="middle" fill="#e7fbff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">VA</text>
  <text x="600" y="390" text-anchor="middle" fill="#9cc5d5" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="2">SIGNAL → INSIGHT</text>

  <g>
    <animateMotion dur="24s" repeatCount="indefinite" rotate="auto" path="M 600 112 A 188 188 0 1 1 599.9 112"/>
    <circle r="3.5" fill="#e5fcff" filter="url(#cyan-glow)"/>
    <circle r="9" fill="none" stroke="#00d9ff" stroke-opacity=".5"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 300" to="360 600 300" dur="90s" repeatCount="indefinite"/>
    <circle cx="600" cy="173" r="2" fill="#85f3ff"/>
    <circle cx="600" cy="427" r="2" fill="#85f3ff"/>
    <circle cx="473" cy="300" r="2" fill="#85f3ff"/>
    <circle cx="727" cy="300" r="2" fill="#85f3ff"/>
  </g>

  <text x="600" y="584" text-anchor="middle" fill="#5d8293" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="2">VA / APPLIED INTELLIGENCE / NAGPUR, INDIA</text>
</svg>
